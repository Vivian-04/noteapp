<!DOCTYPE html>
<html lang="en" data-theme="system" data-font="sans-serif">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <title>Forgot Password - Notes App</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../base.css">
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-inner">
        <div class="auth-step" id="emailStep">
          <div class="auth-header">
            <a href="../index.html" class="auth-logo" aria-label="Notes App Home">
              <img src="../assets/images/logo-dark.svg" alt="Notes App">
            </a>
            <h1 class="auth-title">Forgotten your password?</h1>
            <p class="auth-subtitle">Enter your email below, and we'll send you a link to reset it.</p>
          </div>

          <form class="auth-form" id="forgotPasswordForm" novalidate>
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <div class="form-input-wrapper">
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  class="form-input" 
                  placeholder="email@example.com"
                  required
                  aria-required="true"
                  aria-describedby="email-error">
              </div>
              <span class="form-error" id="email-error" role="alert" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn-auth-primary">Send Reset Link</button>
          </form>
        </div>
      </div>

      <div class="auth-theme-toggle">
        <button 
          type="button"
          class="theme-toggle" 
          id="themeToggle" 
          aria-label="Switch to dark mode"
          aria-live="polite">
          <img src="../assets/images/icon-moon.svg" alt="" class="theme-icon" id="themeIcon" aria-hidden="true">
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="../js/pages/forgot-password.js"></script>
</body>
</html>
