<!DOCTYPE html>
<html lang="en" data-theme="system" data-font="sans-serif">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <title>Reset Password - Notes App</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../base.css">
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-inner">
        <div class="auth-step">
          <div class="auth-header">
            <a href="../index.html" class="auth-logo" aria-label="Notes App Home">
              <img src="../assets/images/logo-dark.svg" alt="Notes App">
            </a>
            <h1 class="auth-title">Reset Your Password</h1>
            <p class="auth-subtitle">Choose a new password to secure your account.</p>
          </div>

          <form class="auth-form" id="resetPasswordForm" novalidate>
            <div id="newPasswordContainer"></div>
            <div id="confirmPasswordContainer"></div>

            <button type="submit" class="btn-auth-primary">Reset Password</button>
          </form>
        </div>
      </div>

      <div class="auth-theme-toggle">
        <button 
          type="button"
          class="theme-toggle" 
          id="themeToggle" 
          aria-label="Switch to dark mode"
          aria-live="polite">
          <img src="../assets/images/icon-moon.svg" alt="" class="theme-icon" id="themeIcon" aria-hidden="true">
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="../js/pages/reset-password.js"></script>
</body>
</html>
