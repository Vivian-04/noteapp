<!DOCTYPE html>
<html lang="en" data-theme="system" data-font="sans-serif">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <title>Login - Notes App</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../base.css">
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo" aria-label="Notes App Home">
          <img src="../assets/images/logo-dark.svg" alt="Notes App">
        </a>
        <h1 class="auth-title">Welcome to Note</h1>
        <p class="auth-subtitle">Please log in to continue</p>
      </div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="form-input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="example@email.com"
              required
              aria-required="true"
              aria-describedby="email-error">
          </div>
          <span class="form-error" id="email-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="password" class="form-label">Password</label>
            <a href="./forgot-password.html" class="form-link">Forgot</a>
          </div>
          <div class="form-input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder=""
              required
              aria-required="true"
              aria-describedby="password-error password-toggle">
            <button 
              type="button" 
              class="form-toggle-password" 
              id="passwordToggle"
              aria-label="Show password"
              aria-pressed="false"
              aria-controls="password">
              <img src="../assets/images/icon-show-password.svg" alt="" class="toggle-icon" aria-hidden="true">
            </button>
          </div>
          <span class="form-error" id="password-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn-auth-primary">Login</button>
      </form>

      <div class="auth-divider-line auth-divider-top"></div>

      <div class="auth-divider">
        <span class="divider-text">Or log in with:</span>
      </div>

      <button type="button" class="btn-auth-google" aria-label="Login with Google">
        <img src="../assets/images/icon-google.svg" alt="" class="google-icon" aria-hidden="true">
        <span>Google</span>
      </button>
      
      <div class="auth-divider-line"></div>

      <p class="auth-footer">
        No account yet? <a href="./signup.html" class="auth-link">Sign Up</a>
      </p>

      <div class="auth-theme-toggle">
        <button 
          type="button"
          class="theme-toggle" 
          id="themeToggle" 
          aria-label="Switch to dark mode"
          aria-live="polite">
          <img src="../assets/images/icon-moon.svg" alt="" class="theme-icon" id="themeIcon" aria-hidden="true">
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
